services:
  postgres:
    image: postgres:18-alpine
    container_name: fusion-ai-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Intent: "Fusion AI" — underscore avoids URL/tooling issues with spaces
      POSTGRES_DB: ${POSTGRES_DB:-Fusion_AI}
    volumes:
      # Postgres 18+ requires mounting /var/lib/postgresql (not .../data)
      - fusion_ai_pg18_data:/var/lib/postgresql

volumes:
  fusion_ai_pg18_data:
